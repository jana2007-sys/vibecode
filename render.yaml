# Render Blueprint — one-click deployment for InterVue AI.
#
# Creates: a managed PostgreSQL database, the FastAPI backend (Web Service),
# and the built React frontend (Static Site). Deploy with the "Blueprint"
# option in the Render dashboard, or via the Render CLI:
#   render blueprint launch
#
# Environment wiring (Render Blueprint schema):
#  * DATABASE_URL  — injected from the managed PostgreSQL instance via
#    fromDatabase.connectionString. When the backend sees a postgres:// DSN it
#    automatically uses PostgreSQL (backend/app/database/schema_postgres.sql).
#  * CORS_ORIGINS  — resolved from the deployed frontend's own public URL.
#    fromService does NOT support property: url, so we reference the platform
#    variable RENDER_EXTERNAL_URL of the frontend service via envVarKey, which
#    Render fills with https://intervue-frontend.onrender.com.
#  * VITE_API_URL  — resolved the same way from the backend's RENDER_EXTERNAL_URL
#    (https://intervue-api.onrender.com). frontend/src/services/http.ts already
#    normalizes a bare origin to .../api, so the UI calls
#    https://intervue-api.onrender.com/api. No manual env var is required.
#  * GEMINI_API_KEY — intentionally NOT hardcoded here. Set it in the Render
#    dashboard (or leave the deterministic evaluator on).
#  * The SPA rewrite sends every route to /index.html so React Router works on
#    refresh / deep links.

databases:
  - name: intervue-db
    databaseName: intervue
    user: intervue
    plan: free

services:
  - type: web
    name: intervue-api
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: intervue-db
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          name: intervue-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GEMINI_ENABLED
        value: "false"

  - type: web
    name: intervue-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: intervue-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
